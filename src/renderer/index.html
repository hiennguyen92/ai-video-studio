
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>AI Video Studio</title>
    <!--
      CSP: chỉ cho phép media/ảnh đến từ scheme avstudio-media:// của chính ứng dụng.
      'unsafe-inline' cho style là bắt buộc vì React đặt style nội tuyến cho
      transform của clip và cỡ chữ phụ đề.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: avstudio-media:; media-src 'self' avstudio-media:; font-src 'self' data:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
