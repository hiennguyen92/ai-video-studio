appId: com.electron.app
productName: ai-video-studio
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Không đóng gói vào asar.
#
# Remotion tự `chmod` file nhị phân dựng hình của nó theo đường dẫn nó tự phân
# giải, và đường đó trỏ vào `app.asar/...`. asar là một kho ảo, không phải thư
# mục thật, nên thao tác đó ngã với ENOTDIR và cả lần xuất chết — kể cả khi
# electron-builder đã chép sẵn file ra `app.asar.unpacked`.
#
# Bỏ asar là cách chắc chắn nhất: mọi đường dẫn thành file thật. Đánh đổi là ứng
# dụng khởi động chậm hơn một chút và số file trong thư mục cài nhiều hơn.
asar: false
extraResources:
  # Bundle Remotion dựng sẵn lúc build. Không có nó thì xuất video trong bản cài
  # ngã ngay: `src/` không nằm trong gói và Remotion không dựng được từ asar.
  - from: out/remotion-bundle
    to: remotion-bundle
  # Thư viện hiệu ứng âm thanh, dựng bằng ffmpeg lúc build. Dự án lưu id chứ
  # không lưu đường dẫn, và id được phân giải về đúng thư mục này.
  - from: out/sound-effects
    to: sound-effects
win:
  executableName: ai-video-studio
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false

# Không khai báo `publish`.
#
# Cấu hình scaffold để lại một địa chỉ example.com vô nghĩa, và chính nó kéo
# electron-builder chạy nhánh dựng thông tin cập nhật vi sai. Nhánh đó ngã vì
# app-builder-lib 26.15.3 gọi `@noble/hashes` bằng require() trong khi gói này
# chỉ còn ESM — lỗi nằm trong chính electron-builder, và 26.15.3 đã là bản mới
# nhất nên không có bản vá để nâng lên.
#
# Khi nào thật sự làm tự động cập nhật thì mới khai báo lại, kèm một địa chỉ thật.
